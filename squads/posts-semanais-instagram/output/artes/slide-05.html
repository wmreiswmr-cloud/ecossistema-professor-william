<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Inter:wght@500;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px; overflow:hidden;
    background:linear-gradient(160deg,#0D1830,#1B2A4A 45%,#0A1224);
    color:#F5F3EE; font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; padding:72px; position:relative;
  }
  .glow1 { position:absolute; top:-120px; right:-120px; width:480px; height:480px; background:radial-gradient(circle,#3D6FB433,transparent 70%); }
  .glow2 { position:absolute; bottom:-100px; left:-100px; width:400px; height:400px; background:radial-gradient(circle,#C9A24B22,transparent 70%); }
  .tag {
    position:relative; z-index:1; display:inline-block; background:#C9A24B33;
    border-radius:8px; padding:8px 20px; font-size:24px; color:#E0BE7A;
    font-weight:800; text-transform:uppercase; letter-spacing:3px; margin-bottom:28px;
  }
  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; }
  h1 { position:relative; z-index:1; font-family:'Poppins',sans-serif; font-size:52px; font-weight:900; line-height:1.3; margin:0 0 32px 0; }
  h1 .accent { background:linear-gradient(90deg,#5B8DEF,#E0BE7A); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .lead { position:relative; z-index:1; font-size:34px; color:#AEBBD1; line-height:1.55; font-weight:500; }
  .footer { position:relative; z-index:1; display:flex; align-items:center; gap:20px; padding-top:24px; border-top:1px solid #F5F3EE20; margin-top:auto; }
  .avatar { width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#5B8DEF,#E0BE7A); }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div>
  <div class="tag">Pergunta frequente</div>
  <div class="hero">
    <h1>"Meu filho de 6 anos ainda não lê sozinho, <span class="accent">isso é normal?</span>"</h1>
    <p class="lead">Depende do estágio. Mas atraso significativo pra juntar letras e sílabas, muitas trocas na leitura e frustração constante com as atividades não são "fase" — são sinais de alerta.</p>
  </div>
  <div class="footer">
    <div class="avatar"></div>
    <span style="font-size:24px;color:#AEBBD1;">William Marilio Reis</span>
    <span style="margin-left:auto;font-size:24px;color:#6B7A99;">ARRASTE →</span>
  </div>
</body>
</html>
