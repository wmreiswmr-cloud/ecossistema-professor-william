<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Inter:wght@500;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px; overflow:hidden;
    background:linear-gradient(160deg,#0D1830,#1B2A4A 45%,#0A1224);
    color:#F5F3EE; font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; padding:72px; position:relative;
  }
  .glow1 { position:absolute; top:-120px; right:-120px; width:480px; height:480px; background:radial-gradient(circle,#3D6FB455,transparent 70%); }
  .glow2 { position:absolute; bottom:-100px; left:-100px; width:400px; height:400px; background:radial-gradient(circle,#C9A24B44,transparent 70%); }
  .tag {
    position:relative; z-index:1; display:inline-block; background:#C9A24B;
    border-radius:8px; padding:8px 20px; font-size:24px; color:#0D1830;
    font-weight:800; text-transform:uppercase; letter-spacing:3px; margin-bottom:28px;
  }
  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; }
  h1 { position:relative; z-index:1; font-family:'Poppins',sans-serif; font-size:52px; font-weight:900; line-height:1.3; margin:0 0 32px 0; }
  .lead { position:relative; z-index:1; font-size:34px; color:#AEBBD1; line-height:1.55; font-weight:500; }
  .cta-box { position:relative; z-index:1; margin-top:40px; background:#C9A24B33; border:1px solid #C9A24B55; border-radius:16px; padding:32px; }
  .cta-box .cta-text { font-size:34px; font-weight:800; color:#E0BE7A; font-family:'Poppins',sans-serif; }
  .footer { position:relative; z-index:1; display:flex; align-items:center; gap:20px; padding-top:24px; border-top:1px solid #F5F3EE20; }
  .avatar { width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#5B8DEF,#E0BE7A); }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div>
  <div class="tag">Próximo passo</div>
  <div class="hero">
    <h1>Reconheceu algum desses sinais no seu filho?</h1>
    <div class="cta-box">
      <span class="cta-text">Manda uma mensagem — vamos conversar sobre o caso dele.</span>
    </div>
  </div>
  <div class="footer">
    <div class="avatar"></div>
    <span style="font-size:24px;color:#AEBBD1;">William Marilio Reis</span>
    <span style="margin-left:auto;font-size:24px;color:#E0BE7A;">Manda mensagem 💬</span>
  </div>
</body>
</html>
