                - generic [ref=f6e158]: "Enquanto esperamos a próxima grande solução para a educação, a infância continua acontecendo. O ano letivo avança. A criança cresce. E todos os dias existe uma professora diante dela precisando tomar decisões que não podem esperar:O que ensinar agora?O que precisa vir primeiro?Quando avançar?Quando intervir?E o que fazer quando a criança não aprende como esperado?Há problemas da educação que a professora não pode e não deve resolver sozinha. Mas existem decisões pedagógicas que ela precisa tomar todos os dias. E é justamente por isso que, em vez de colocar sobre ela mais uma cobrança, mais um projeto ou mais uma tarefa, precisamos fortalecer aquilo que sustenta essas decisões: conhecimento.Conhecimento para proteger o tempo pedagógico e reconhecer, entre tantas demandas, o que não pode deixar de ser ensinado. Conhecimento para alfabetizar e para saber o que fazer depois que a criança aprende a ler. E para continuar ensinando quando aprender se torna mais difícil. Porque são aproximadamente 200 dias letivos todos os anos. Não são apenas 200 dias para ensinar. São 200 dias para decidir. E as grandes mudanças podem levar tempo. A infância, não.Por isso, quero passar 6 horas com você em \"O Resgate da Alfabetização e do Letramento no Brasil\", pensando como alfabetizar, letrar e incluir no século XXI.Não apenas para o restante deste ano. Mas para construir um conhecimento que você poderá levar para os próximos alunos, para os próximos anos e para a professora que ainda pode se tornar. Seu aluno tem aula amanhã. Que conhecimento você quer levar para essa sala?🎟️ Ingressos por R$ 9,90 no preço de lançamento. Acesse o link da bio e garanta o seu."
